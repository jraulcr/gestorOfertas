<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Importar Ofertas')}">
	<link rel="icon" th:href="@{/icono/favicon.ico}" type="image/x-icon">
</head>
<body>
	<div th:with="volverHome=true">
		<nav th:replace="~{fragments/navbar :: navbar}"></nav>
	</div>

	<div class="container">
		<div class="import-card">
			<div class="form-header">
				<h3 class="mb-0">
					<i class="bi bi-upload"></i> <span th:text="#{import.title}">Importar
						Ofertas desde CSV</span>
				</h3>
			</div>

			<div class="alert alert-info mt-3">
				<i class="bi bi-info-circle"></i> <strong
					th:text="#{import.formatInfo}">Formato esperado...</strong>
			</div>

			<form th:action="@{/importar}" method="post"
				enctype="multipart/form-data">
				<div class="mb-3">
					<label for="file" class="form-label" th:text="#{import.selectFile}">Seleccionar
						archivo CSV</label> <input type="file" class="form-control" id="file"
						name="file" accept=".csv" required>
				</div>

				<div class="d-flex justify-content-between">
					<a th:href="@{/home}" class="btn btn-secondary"> <i
						class="bi bi-arrow-left"></i> <span th:text="#{btn.cancel}">Cancelar</span>
					</a>
					<button type="submit" class="btn btn-primary">
						<i class="bi bi-upload"></i> <span th:text="#{btn.import}">Importar</span>
					</button>
				</div>
			</form>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
