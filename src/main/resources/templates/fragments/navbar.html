<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="navbar" class="navbar navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-briefcase-fill"></i> <span th:text="#{app.nav.brand}">Gestor de Ofertas</span>
        </span>
        <div class="d-flex align-items-center">
            <span class="text-light me-3">
                <span th:text="#{app.nav.hello}">Hola</span>, <span th:text="${username}">usuario</span>
            </span>
            <a th:href="@{/cambiar-password}" class="btn btn-outline-light btn-sm me-2" th:title="#{app.nav.changePassword}">
                <i class="bi bi-shield-lock"></i>
            </a>
            <a th:if="${volverHome}" th:href="@{/home}" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-arrow-left"></i> <span th:text="#{app.nav.backToList}">Volver al listado</span>
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm" th:text="#{app.nav.logout}">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>
</html>
