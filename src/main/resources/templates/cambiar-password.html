<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar Contraseña - GestorOfertas</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/form.css}">
<link rel="stylesheet" th:href="@{/css/password.css}">
</head>
<body>
	<div class="password-card">
		<div class="header">
			<h1>
				<i class="bi bi-shield-lock"></i> Cambiar Contraseña
			</h1>
		</div>

		<!-- MENSAJES FLASH (POPUPS) -->
		<div th:if="${mensaje}"
			th:class="'alert alert-dismissible fade show ' +
                       (${tipoMensaje == 'SUCCESS'} ? 'alert-success' :
                        (${tipoMensaje == 'WARNING'} ? 'alert-warning' : 'alert-danger'))"
			role="alert" id="flashMessage">
			<i
				th:class="${tipoMensaje == 'SUCCESS'} ? 'bi bi-check-circle' :
                         (${tipoMensaje == 'WARNING'} ? 'bi bi-exclamation-triangle' : 'bi bi-exclamation-circle')"></i>
			<span th:text="${mensaje}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Close"></button>
		</div>

		<form th:action="@{/cambiar-password}" method="post">

			<!-- SECCIÓN: CAMBIAR NOMBRE DE USUARIO (OPCIONAL) -->
			<div class="section">
				<div class="section-title">
					<i class="bi bi-person"></i> Cambiar nombre de usuario <span
						class="optional-badge">(Opcional)</span>
				</div>

				<div class="mb-3">
					<label for="nuevoUsername" class="form-label"> <i
						class="bi bi-at"></i> Nuevo nombre de usuario
					</label> <input type="text" class="form-control" id="nuevoUsername"
						name="nuevoUsername" th:value="${username}"
						placeholder="Déjalo vacío si no quieres cambiarlo">
					<div class="info-text">
						<i class="bi bi-info-circle"></i> Si lo cambias, tendrás que
						volver a iniciar sesión con el nuevo nombre.
					</div>
				</div>
			</div>

			<!-- SECCIÓN: CAMBIAR CONTRASEÑA -->
			<div class="section">
				<div class="section-title">
					<i class="bi bi-key"></i> Cambiar contraseña
				</div>

				<div class="mb-3">
					<label for="passwordActual" class="form-label"> Contraseña
						actual </label>
					<div class="input-group">
						<input type="password" class="form-control" id="passwordActual"
							name="passwordActual"
							placeholder="Déjala vacía si solo cambias el username">
						<button class="btn btn-outline-secondary" type="button"
							id="togglePasswordActual"
							onclick="togglePassword('passwordActual')">
							<i class="bi bi-eye"></i>
						</button>
					</div>
				</div>

				<div class="mb-3">
					<label for="passwordNueva" class="form-label"> Nueva
						contraseña </label>
					<div class="input-group">
						<input type="password" class="form-control" id="passwordNueva"
							name="passwordNueva"
							placeholder="Déjala vacía si solo cambias el username">
						<button class="btn btn-outline-secondary" type="button"
							id="togglePasswordNueva"
							onclick="togglePassword('passwordNueva')">
							<i class="bi bi-eye"></i>
						</button>
					</div>
					<div class="info-text">
						<i class="bi bi-info-circle"></i> Mínimo 6 caracteres. Déjala
						vacía si solo cambias el username.
					</div>
				</div>

				<div class="mb-3">
					<label for="passwordConfirmar" class="form-label">
						Confirmar nueva contraseña </label>
					<div class="input-group">
						<input type="password" class="form-control" id="passwordConfirmar"
							name="passwordConfirmar"
							placeholder="Confirma la nueva contraseña">
						<button class="btn btn-outline-secondary" type="button"
							id="togglePasswordConfirmar"
							onclick="togglePassword('passwordConfirmar')">
							<i class="bi bi-eye"></i>
						</button>
					</div>
				</div>
			</div>

			<!-- BOTONES -->
			<div class="d-grid gap-2">
				<button type="submit" class="btn btn-primary btn-lg">
					<i class="bi bi-check-circle"></i> Guardar cambios
				</button>
				<a th:href="@{/home}" class="btn btn-secondary"> <i
					class="bi bi-arrow-left"></i> Volver al home
				</a>
			</div>
		</form>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/main.js}"></script>
</body>
</html>
